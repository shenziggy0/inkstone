name: dispatch-package-012

# 一次性：用运行器自己的 GITHUB_TOKEN 触发 tag 0.1.2 上的 package。
# 云代理令牌没有 Actions 写权限。成功派发后会删除本文件。
on:
  push:
    paths:
      - .github/workflows/dispatch-package-012.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch package workflow for tag 0.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run package.yml --ref 0.1.2
