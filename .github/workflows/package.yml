name: package

# 只由手动触发。打出安装包、上传为 Actions artifact，并在 GitHub 服务器内网把双平台包
# 自动挂载到对应 tag 的 Release 草稿（已存在则覆盖同名附件，不改动正文与发布状态；
# 不存在则新建草稿供人工填文案后发布）。不推送 tag。
# macOS 为临时签名（ad-hoc），没有 Developer ID，也不公证。Windows 安装包不签名。
# electron-builder 在 CI 环境里会默认尝试发布到 GitHub Releases；--publish never
# 关掉这一行为，package 作业只有 contents: read 权限，真正挂载草稿由收尾作业完成。
# CSC_IDENTITY_AUTO_DISCOVERY=false 避免在没有证书时去钥匙串或证书库里找签名身份并失败。
# macOS 仍会按 package.json 的 mac.identity="-" 做临时签名（ad-hoc），
# afterSign 在打 dmg 之前执行 codesign --verify --deep --strict，失败则整次构建失败。
# macos-latest 是 Apple Silicon runner，--arm64 为本机架构。
#
# 版本号来自 git tag，只改运行器上的 package.json / package-lock.json，不提交、不推送：
# - Use workflow from 选中 tag 时，用该 tag 名
# - 选中分支时，用 git describe 能追溯到的最近一个 1.2.3 或 v1.2.3 tag
# 去掉前导 v 后必须是主.次.修订，否则失败，不猜测版本。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.TAG }}
      version: ${{ steps.version.outputs.VERSION }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --win nsis --x64 --publish never
            installer: |
              release/*.exe
              release/Windows安装说明.txt
          - os: macos-latest
            name: macos-arm64
            args: --mac dmg --arm64 --publish never
            installer: |
              release/*.dmg
              release/安装前请阅读 - Read Me.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 0 表示全部历史。checkout 在这个深度会连 tags 一起取；
          # fetch-tags 再声明一次，保证 runner 上能看到 0.1.1 / v1.2.3 这类 tag。
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 与 .github/workflows/ci.yml 相同：仓库没有 engines / .nvmrc，
          # 显式锁定 Node 26.x。
          node-version: '26.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version from git tag
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            RAW_TAG="$REF_NAME"
          else
            if ! RAW_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --match 'v[0-9]*.[0-9]*.[0-9]*'); then
              echo "::error::找不到可用的版本 tag。请推送形如 0.1.1 或 v1.2.3 的 tag，或在 Run workflow 的 Use workflow from 里选择该 tag。不会猜测版本号。"
              exit 1
            fi
          fi

          VERSION="${RAW_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号 '${VERSION}'（来自 tag '${RAW_TAG}'）不是主.次.修订（例如 0.1.1 或 v0.1.1）。不会猜测版本号。"
            exit 1
          fi

          HEAD_COMMIT=$(git rev-parse HEAD)
          if ! TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/${RAW_TAG}^{commit}"); then
            echo "::error::无法解析 tag '${RAW_TAG}'，不能确认它指向哪个提交。"
            exit 1
          fi

          echo "Version: ${VERSION} (tag: ${RAW_TAG})"
          echo "TAG=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::warning::HEAD ${HEAD_COMMIT} 并不正好在 tag ${RAW_TAG}（${TAG_COMMIT}）上，本次构建包含该 tag 之后的提交。"
          fi

      - name: Set package version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Package unsigned installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --no-install electron-builder ${{ matrix.args }}

      - name: Stage install notes next to the installer
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "macos-arm64" ]; then
            cp "docs/install/macOS安装说明.txt" "release/安装前请阅读 - Read Me.txt"
            test -s "release/安装前请阅读 - Read Me.txt"
            test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          else
            cp "docs/install/Windows安装说明.txt" "release/Windows安装说明.txt"
            test -s "release/Windows安装说明.txt"
            test -n "$(find release -maxdepth 1 -name '*.exe' -print -quit)"
          fi

      - name: Show codesign and dmg contents
        if: matrix.name == 'macos-arm64'
        run: |
          set -euo pipefail
          APP="$(find release -type d -name 'Inkstone.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::找不到 Inkstone.app"
            find release -maxdepth 3 -print
            exit 1
          fi
          echo "=== codesign -dv $APP ==="
          /usr/bin/codesign -dv "$APP" 2>&1
          echo "=== codesign --verify --deep --strict $APP ==="
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP" 2>&1
          echo "codesign --verify --deep --strict: passed"

          DMG="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          echo "=== hdiutil verify $DMG ==="
          /usr/bin/hdiutil verify "$DMG"

          MOUNT="$(mktemp -d)"
          cleanup() {
            /usr/bin/hdiutil detach "$MOUNT" >/dev/null 2>&1 || true
            rmdir "$MOUNT" 2>/dev/null || true
          }
          trap cleanup EXIT
          /usr/bin/hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          echo "=== dmg contents $MOUNT ==="
          ls -la "$MOUNT"
          test -d "$MOUNT/Inkstone.app"
          test -L "$MOUNT/Applications"
          test -f "$MOUNT/安装前请阅读 - Read Me.txt"
          echo "Applications -> $(readlink "$MOUNT/Applications")"
          echo "=== codesign -dv (app inside dmg) ==="
          /usr/bin/codesign -dv "$MOUNT/Inkstone.app" 2>&1
          echo "=== codesign --verify --deep --strict (app inside dmg) ==="
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$MOUNT/Inkstone.app" 2>&1
          echo "codesign --verify --deep --strict (app inside dmg): passed"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: inkstone-${{ steps.version.outputs.VERSION }}-${{ matrix.name }}
          path: ${{ matrix.installer }}
          retention-days: 7
          if-no-files-found: error

  draft-release:
    name: upload assets to draft release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack zip assets
        shell: bash
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for platform in windows-x64 macos-arm64; do
            dir="artifacts/inkstone-${VERSION}-${platform}"
            test -d "$dir"
            (cd "$dir" && zip -r "$OLDPWD/release-assets/inkstone-${VERSION}-${platform}.zip" .)
          done
          ls -lh release-assets

      - name: Attach assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          WIN_ZIP="release-assets/inkstone-${VERSION}-windows-x64.zip"
          MAC_ZIP="release-assets/inkstone-${VERSION}-macos-arm64.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets with --clobber..."
            gh release upload "$TAG" "$WIN_ZIP" "$MAC_ZIP" --clobber
          else
            echo "Creating draft release for ${TAG}..."
            gh release create "$TAG" "$WIN_ZIP" "$MAC_ZIP" \
              --draft \
              --title "墨页 Inkstone ${VERSION}" \
              --notes ""
          fi
